<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Mirta Godoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0F0C0A;--fg:#F3E7D3;--muted:#B8A78E;--card:#1A1512;--line:#3A2E22;--gold:#D4A84F;--gold-hi:#F0CD7E;--red:#E05A5A;--ok:#25A35A;
  --display:"Bodoni Moda",Didot,Georgia,serif;--body:"Jost",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:0;color:var(--gold-hi)}
h2{font-family:var(--display);font-size:24px;margin:0 0 12px}
.muted{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input,select{font:16px var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn{font:700 16px var(--body);border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1A1208}
.btn.line{background:transparent;border:1.5px solid var(--gold);color:var(--gold-hi)}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.msg{font-size:14.5px;border-radius:10px;padding:10px 12px;margin:0}
.msg.err{background:rgba(224,90,90,.12);color:#F2A3A3}.msg.ok{background:rgba(37,163,90,.14);color:#8FE0AE}
.drop{border:2px dashed var(--gold);border-radius:16px;padding:22px;text-align:center;cursor:pointer;color:var(--muted)}
.drop b{color:var(--gold-hi);display:block;font-size:17px;margin-bottom:4px}
.drop.on{background:rgba(212,168,79,.08)}
.queue{display:flex;flex-direction:column;gap:8px}
.qi{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px}
.qi .bar{grid-column:1/-1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.qi .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.it img,.it video{width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;display:block}
.it div{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.it b{font-size:14px;overflow-wrap:anywhere}.it span{color:var(--muted);overflow-wrap:anywhere}
.del{font:600 13px var(--body);background:transparent;border:1px solid var(--line);color:#F2A3A3;border-radius:8px;padding:6px;cursor:pointer;margin-top:4px}
a{color:var(--gold-hi)}
</style>
</head>
<body>
<div class="wrap">
  <header class="row">
    <div><h1>Panel de Mirta</h1><p class="muted">Fotos y videos de los shows</p></div>
    <a href="./">Ver la página →</a>
  </header>

  <!-- Ingreso -->
  <section class="card" id="login" hidden>
    <h2>Ingresar</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Tu email<input type="email" id="email" autocomplete="username" required></label>
      <label>Contraseña<input type="password" id="pass" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
      <p class="msg err" id="loginErr" hidden></p>
    </form>
  </section>

  <!-- Sin permiso -->
  <section class="card" id="noadmin" hidden>
    <h2>Esta cuenta no tiene permiso</h2>
    <p class="muted">Solo Mirta y Génesis pueden subir contenido.</p>
    <button class="btn line salir" type="button">Salir</button>
  </section>

  <!-- Panel -->
  <div id="panel" hidden style="display:flex;flex-direction:column;gap:22px">
    <div class="row"><p class="muted">Hola, <b id="who" style="color:var(--fg)"></b></p>
      <div class="row" style="gap:8px"><button class="btn line" type="button" id="passBtn">Cambiar contraseña</button><button class="btn line salir" type="button">Salir</button></div></div>

    <section class="card" id="passCard" hidden>
      <h2>Nueva contraseña</h2>
      <label>Contraseña nueva (mínimo 8 caracteres)<input type="password" id="newPass" autocomplete="new-password" minlength="8"></label>
      <button class="btn" type="button" id="savePass">Guardar</button>
      <p class="msg" id="passMsg" hidden></p>
    </section>

    <section class="card">
      <h2>Subir fotos o videos</h2>
      <label>¿De qué evento son?<input type="text" id="evento" placeholder="Ej: Un cafecito con la Godoy · domingo 8"></label>
      <label>Título o descripción (opcional)<input type="text" id="titulo" placeholder="Ej: Bailando chacarera con los taxi dancers"></label>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Elegir fotos o videos"><b>Tocá para elegir fotos o videos</b>o arrastralos acá · hasta 50 MB por archivo</div>
      <input type="file" id="files" accept="image/*,video/*" multiple hidden>
      <div class="queue" id="queue"></div>
    </section>

    <section class="card">
      <div class="row"><h2 style="margin:0">Lo que ya está en la página</h2><span class="muted" id="count"></span></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://syxhetsgfcfjdazyyfhv.supabase.co';
const SUPA_KEY='sb_publishable_0BClC2xOaNPiR2dVjX59kg_MbBKtFRz';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);
const show=id=>['login','noadmin','panel'].forEach(x=>$(x).hidden=x!==id);
const pub=ruta=>sb.storage.from('eventos').getPublicUrl(ruta).data.publicUrl;

async function arrancar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){show('login');return}
  const {data:ok}=await sb.rpc('es_admin');
  if(!ok){show('noadmin');return}
  const {data:yo}=await sb.from('admins').select('nombre').eq('email',session.user.email.toLowerCase()).maybeSingle();
  $('who').textContent=(yo&&yo.nombre)||session.user.email;
  show('panel');cargar();
}
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginErr').hidden=true;$('loginBtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('loginBtn').disabled=false;
  if(error){$('loginErr').textContent='El email o la contraseña no coinciden. Revisalos y probá de nuevo.';$('loginErr').hidden=false;return}
  arrancar();
});
document.querySelectorAll('.salir').forEach(b=>b.addEventListener('click',async()=>{await sb.auth.signOut();show('login')}));
$('passBtn').onclick=()=>{$('passCard').hidden=!$('passCard').hidden};
$('savePass').onclick=async()=>{
  const p=$('newPass').value,m=$('passMsg');
  if(p.length<8){m.className='msg err';m.textContent='La contraseña tiene que tener al menos 8 caracteres.';m.hidden=false;return}
  const {error}=await sb.auth.updateUser({password:p});
  m.className='msg '+(error?'err':'ok');m.textContent=error?'No se pudo guardar. Probá de nuevo en un momento.':'Listo, la próxima vez entrá con la contraseña nueva.';m.hidden=false;
  if(!error)$('newPass').value='';
};

// Subir
const drop=$('drop'),inp=$('files');
drop.onclick=()=>inp.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove('on')));
drop.addEventListener('drop',e=>{e.preventDefault();subir([...e.dataTransfer.files])});
inp.onchange=()=>{subir([...inp.files]);inp.value=''};

async function subir(files){
  const evento=$('evento').value.trim(),titulo=$('titulo').value.trim();
  for(const f of files){
    const row=document.createElement('div');row.className='qi';
    row.innerHTML=`<span></span><span class="st">Subiendo…</span><span class="bar"><i></i></span>`;
    row.firstChild.textContent=f.name;$('queue').prepend(row);
    const st=row.querySelector('.st'),bar=row.querySelector('i');
    const tipo=f.type.startsWith('video')?'video':f.type.startsWith('image')?'foto':null;
    if(!tipo){st.textContent='Ese archivo no es foto ni video';continue}
    if(f.size>50*1024*1024){st.textContent=`Pesa ${(f.size/1048576).toFixed(0)} MB: el máximo es 50 MB`;continue}
    bar.style.width='35%';
    const ext=(f.name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'')||(tipo==='video'?'mp4':'jpg');
    const ruta=`${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}.${ext}`;
    const up=await sb.storage.from('eventos').upload(ruta,f,{contentType:f.type,cacheControl:'31536000'});
    if(up.error){st.textContent='No se pudo subir. Probá de nuevo.';bar.style.width='0';continue}
    bar.style.width='80%';
    const ins=await sb.from('media').insert({tipo,titulo,evento,ruta});
    if(ins.error){st.textContent='Se subió pero no se guardó. Avisale a Ivana.';continue}
    bar.style.width='100%';st.textContent='¡Listo! Ya está en la página';
  }
  cargar();
}

// Lista
async function cargar(){
  const {data,error}=await sb.from('media').select('*').order('creado',{ascending:false});
  const g=$('grid');
  if(error){g.innerHTML='<p class="msg err">No se pudo cargar la galería.</p>';return}
  $('count').textContent=data.length?`${data.length} ${data.length===1?'archivo':'archivos'}`:'';
  if(!data.length){g.innerHTML='<p class="muted">Todavía no hay fotos ni videos. Subí los primeros arriba.</p>';return}
  g.innerHTML='';
  data.forEach(m=>{
    const el=document.createElement('div');el.className='it';
    const media=m.tipo==='video'?document.createElement('video'):document.createElement('img');
    media.src=pub(m.ruta);if(m.tipo==='video'){media.muted=true;media.preload='metadata';media.controls=true;media.playsInline=true}else{media.alt=m.titulo||m.evento||'Foto del show';media.loading='lazy'}
    const info=document.createElement('div');
    const b=document.createElement('b');b.textContent=m.titulo||(m.tipo==='video'?'Video':'Foto');
    const s=document.createElement('span');s.textContent=m.evento||'';
    const del=document.createElement('button');del.className='del';del.type='button';del.textContent='Sacar de la página';
    let armed=false;
    del.onclick=async()=>{
      if(!armed){armed=true;del.textContent='Tocá de nuevo para confirmar';setTimeout(()=>{armed=false;del.textContent='Sacar de la página'},4000);return}
      del.disabled=true;await sb.storage.from('eventos').remove([m.ruta]);await sb.from('media').delete().eq('id',m.id);cargar();
    };
    info.append(b,s,del);el.append(media,info);g.append(el);
  });
}
arrancar();
</script>
</body>
</html>
